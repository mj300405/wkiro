<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="generatorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="discriminatorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="noiseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="realGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="900" fill="#fff"/>
  
  <!-- Title -->
  <text x="800" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Generative Adversarial Network (GAN) Architecture
  </text>
  
  <!-- Generator Section -->
  <text x="400" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2980b9">Generator Network</text>
  
  <!-- Noise Input -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="80" height="60" fill="url(#noiseGrad)" stroke="#8e44ad" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Noise z</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">100-dim</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">N(0,1)</text>
  </g>
  
  <!-- Generator FC -->
  <g transform="translate(170, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#generatorGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Linear</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">100→12544</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">BatchNorm</text>
    <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">ReLU</text>
  </g>
  
  <!-- Reshape -->
  <g transform="translate(280, 130)">
    <rect x="0" y="0" width="60" height="60" fill="url(#generatorGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Reshape</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256×7×7</text>
  </g>
  
  <!-- Generator ConvT 1 -->
  <g transform="translate(370, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#generatorGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ConvT2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256→128</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- Generator ConvT 2 -->
  <g transform="translate(480, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#generatorGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">ConvT2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→64</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Generator Final Conv -->
  <g transform="translate(590, 130)">
    <rect x="0" y="0" width="80" height="60" fill="url(#generatorGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→1</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Tanh</text>
  </g>
  
  <!-- Fake Image -->
  <g transform="translate(710, 120)">
    <rect x="0" y="0" width="80" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Fake</text>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Image</text>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">G(z)</text>
  </g>
  
  <!-- Real Image -->
  <g transform="translate(850, 250)">
    <rect x="0" y="0" width="80" height="80" fill="url(#realGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Real</text>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Image</text>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">28×28×1</text>
    <text x="40" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">MNIST</text>
  </g>
  
  <!-- Discriminator Section -->
  <text x="1150" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#c0392b">Discriminator Network</text>
  
  <!-- Discriminator Conv 1 -->
  <g transform="translate(850, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">1→64</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- Discriminator Conv 2 -->
  <g transform="translate(960, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→128</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- Discriminator Conv 3 -->
  <g transform="translate(1070, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→256</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=3,s=1</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- Flatten -->
  <g transform="translate(1180, 130)">
    <rect x="0" y="0" width="60" height="60" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Flatten</text>
    <text x="30" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">12544</text>
  </g>
  
  <!-- Discriminator FC 1 -->
  <g transform="translate(1270, 120)">
    <rect x="0" y="0" width="80" height="80" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Linear</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">12544→512</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">LeakyReLU</text>
    <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Dropout</text>
  </g>
  
  <!-- Discriminator FC 2 -->
  <g transform="translate(1380, 130)">
    <rect x="0" y="0" width="80" height="60" fill="url(#discriminatorGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Linear</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">512→1</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Sigmoid</text>
  </g>
  
  <!-- Output Probability -->
  <g transform="translate(1500, 130)">
    <rect x="0" y="0" width="80" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Real?</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">[0,1]</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">D(x)</text>
  </g>
  
  <!-- Arrows for Generator -->
  <path d="M 135 160 L 165 160" stroke="#8e44ad" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 255 160 L 275 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 345 160 L 365 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 455 160 L 475 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 565 160 L 585 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 675 160 L 705 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows for Discriminator (from fake image) -->
  <path d="M 795 160 L 845 160" stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 935 160 L 955 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1045 160 L 1065 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1155 160 L 1175 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1245 160 L 1265 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1355 160 L 1375 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1465 160 L 1495 160" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrows for Discriminator (from real image) -->
  <path d="M 890 250 L 890 205" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>#arrowhead)"/>
  <path d="M 345 160 L 365 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 455 160 L 475 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 565 160 L 585 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 675 160 L 705 160" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>  

  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Training Process -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="1400" height="160" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="700" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">GAN Training Process</text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">Generator Training:</text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Goal: Generate fake images that fool the discriminator</text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Loss: L_G = -log(D(G(z))) - wants D(G(z)) to be close to 1</text>
    <text x="50" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Updates: Only Generator parameters are updated</text>
    
    <text x="750" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">Discriminator Training:</text>
    <text x="750" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Goal: Distinguish real images from fake images</text>
    <text x="750" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Loss: L_D = -log(D(x)) - log(1-D(G(z)))</text>
    <text x="750" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Updates: Only Discriminator parameters are updated</text>
    
    <text x="50" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#8e44ad">Adversarial Training:</text>
    <text x="250" y="135" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Both networks compete: Generator tries to fool Discriminator, Discriminator tries to detect fakes</text>
    <text x="50" y="155" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Training alternates between updating G and D until Nash equilibrium is reached</text>
  </g>
  
  <!-- Architecture Details -->
  <g transform="translate(100, 620)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Architecture Features:</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Generator: Transposed convolutions for upsampling from noise to 28×28 images</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Discriminator: Standard convolutions for downsampling and classification</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Activation functions: ReLU (Generator), LeakyReLU (Discriminator), Tanh (Generator output), Sigmoid (Discriminator output)</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Regularization: BatchNorm, Dropout for stable training</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Input: 100-dimensional Gaussian noise vector, Output: 28×28 grayscale images</text>
  </g>
  
  <!-- Loss Functions -->
  <g transform="translate(100, 750)">
    <rect x="0" y="0" width="1400" height="100" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="700" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Loss Functions</text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Generator Loss: L_G = 𝔼[log(1 - D(G(z)))]  →  minimize to make D(G(z)) ≈ 1</text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Discriminator Loss: L_D = 𝔼[log(D(x))] + 𝔼[log(1 - D(G(z)))]  →  maximize to distinguish real from fake</text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">Min-Max Game: min_G max_D V(D,G) = 𝔼[log(D(x))] + 𝔼[log(1 - D(G(z)))]</text>
  </g>
</svg>