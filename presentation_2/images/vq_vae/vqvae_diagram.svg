<svg viewBox="0 0 1400 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="vqGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="codebookGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="280" fill="#fff"/>
  
  <!-- Input Image -->
  <g transform="translate(50, 160)">
    <rect x="0" y="0" width="80" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Input</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">MNIST</text>
  </g>
  
  <!-- Encoder Section -->
  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Encoder</text>
  
  <!-- Encoder Conv 1 -->
  <g transform="translate(170, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">1→32</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- Encoder Conv 2 -->
  <g transform="translate(260, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→64</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- Encoder Conv 3 -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→64</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=3,s=1</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- Continuous Embeddings -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="80" height="60" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">z_e</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64×7×7</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Continuous</text>
  </g>
  
  <!-- Vector Quantization Section -->
  <text x="700" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">Vector Quantization</text>
  
  <!-- Codebook -->
  <g transform="translate(570, 130)">
    <rect x="0" y="0" width="100" height="120" fill="url(#codebookGrad)" stroke="#8e44ad" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Codebook</text>
    <text x="50" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">512 vectors</text>
    <text x="50" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">64-dim each</text>
    <text x="50" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Learned</text>
    <text x="50" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Embeddings</text>
    <text x="50" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">e ∈ ℝ^(512×64)</text>
  </g>
  
  <!-- Quantization Process -->
  <g transform="translate(700, 160)">
    <rect x="0" y="0" width="100" height="60" fill="url(#vqGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="50" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="white">Quantization</text>
    <text x="50" y="32" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">argmin ||z_e - e_i||</text>
    <text x="50" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Nearest neighbor</text>
  </g>
  
  <!-- Quantized Embeddings -->
  <g transform="translate(830, 160)">
    <rect x="0" y="0" width="80" height="60" fill="url(#vqGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">z_q</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64×7×7</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Discrete</text>
  </g>
  
  <!-- Decoder Section -->
  <text x="1100" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Decoder</text>
  
  <!-- Decoder ConvT 1 -->
  <g transform="translate(950, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">ConvT2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→64</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- Decoder ConvT 2 -->
  <g transform="translate(1040, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">ConvT2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→32</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Decoder Final Conv -->
  <g transform="translate(1130, 160)">
    <rect x="0" y="0" width="70" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→1</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Sigmoid</text>
    <text x="35" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Output Image -->
  <g transform="translate(1230, 160)">
    <rect x="0" y="0" width="80" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Output</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Reconstructed</text>
  </g>
  
  <!-- Arrows -->
  <!-- Encoder flow -->
  <path d="M 135 190 L 165 190" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 245 190 L 255 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 335 190 L 345 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 425 190 L 445 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Quantization flow -->
  <path d="M 535 190 L 565 190" stroke="#7f8c8d" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 675 190 L 695 190" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 805 190 L 825 190" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Decoder flow -->
  <path d="M 915 190 L 945 190" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1025 190 L 1035 190" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1115 190 L 1125 190" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1205 190 L 1225 190" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
</svg>