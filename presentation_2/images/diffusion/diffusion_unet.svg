<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bottleneckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="600" fill="#fff"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Simple U-Net Diffusion Model Architecture
  </text>
  
  <!-- Input -->
  <g transform="translate(50, 210)">
    <rect x="0" y="0" width="70" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Input</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="35" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Noisy</text>
  </g>
  
  <!-- Encoder Section -->
  <text x="300" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Encoder (Downsampling)</text>
  
  <!-- Encoder Block 1 -->
  <g transform="translate(150, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">1→32</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- MaxPool 1 -->
  <g transform="translate(250, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Pool</text>
  </g>
  
  <!-- Encoder Block 2 -->
  <g transform="translate(310, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→64</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- MaxPool 2 -->
  <g transform="translate(410, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Pool</text>
  </g>
  
  <!-- Encoder Block 3 -->
  <g transform="translate(470, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→128</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- MaxPool 3 -->
  <g transform="translate(570, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Pool</text>
  </g>
  
  <!-- Bottleneck -->
  <text x="650" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">Bottleneck</text>
  
  <g transform="translate(630, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#bottleneckGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→128</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">3×3</text>
  </g>
  
  <!-- Decoder Section -->
  <text x="950" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Decoder (Upsampling)</text>
  
  <!-- UpConv 2 -->
  <g transform="translate(730, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">UpConv</text>
  </g>
  
  <!-- Decoder Block 2 -->
  <g transform="translate(790, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">192→64</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- UpConv 1 -->
  <g transform="translate(890, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">UpConv</text>
  </g>
  
  <!-- Decoder Block 1 -->
  <g transform="translate(950, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">96→32</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
  </g>
  
  <!-- UpConv 0 -->
  <g transform="translate(1050, 230)">
    <rect x="0" y="0" width="40" height="20" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1" rx="3"/>
    <text x="20" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">UpConv</text>
  </g>
  
  <!-- Decoder Block 0 -->
  <g transform="translate(1110, 210)">
    <rect x="0" y="0" width="80" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">UNet Block</text>
    <text x="40" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→32</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Conv×2</text>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Final Conv -->
  <g transform="translate(1210, 210)">
    <rect x="0" y="0" width="60" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">Conv 1×1</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→1</text>
    <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Output -->
  <g transform="translate(1290, 210)">
    <rect x="0" y="0" width="70" height="60" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Output</text>
    <text x="35" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="35" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">Denoised</text>
  </g>
  
  <!-- Main Flow Arrows -->
  <path d="M 125 240 L 145 240" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 235 240 L 245 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 295 240 L 305 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 395 240 L 405 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 455 240 L 465 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 555 240 L 565 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 615 240 L 625 240" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <path d="M 715 240 L 725 240" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 775 240 L 785 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 875 240 L 885 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 935 240 L 945 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1035 240 L 1045 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1095 240 L 1105 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1195 240 L 1205 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1275 240 L 1285 240" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Skip Connections -->
  <path d="M 190 210 Q 190 120 510 120 Q 830 120 830 210" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 350 210 Q 350 130 670 130 Q 990 130 990 210" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 510 210 Q 510 140 830 140 Q 1150 140 1150 210" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Skip Connection Label -->
  <text x="700" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Skip Connections (Feature Concatenation)</text>
  
  <!-- UNet Block Details -->
  <g transform="translate(100, 350)">
    <rect x="0" y="0" width="1200" height="120" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="600" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">U-Net Architecture Details</text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2980b9">UNet Block Structure:</text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Two consecutive 3×3 convolutions with GroupNorm (4 groups) and ReLU activation</text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• GroupNorm provides better stability than BatchNorm for small batch sizes</text>
    <text x="50" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Each block maintains spatial resolution, pooling/upsampling happens between blocks</text>
    
    <text x="650" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c0392b">Skip Connections:</text>
    <text x="650" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Concatenate encoder features with decoder features at matching resolutions</text>
    <text x="650" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Preserves fine-grained details lost during downsampling</text>
    <text x="650" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Channel concatenation: e.g., 64 + 128 = 192 channels for dec2 input</text>
  </g>
  
  <!-- Technical Specifications -->
  <g transform="translate(100, 490)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Technical Specifications:</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Input/Output: 28×28×1 grayscale images (MNIST compatible)</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Architecture: Symmetric encoder-decoder with 3 downsampling and 3 upsampling stages</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Channel progression: 1→32→64→128→128→64→32→1</text>
    <text x="700" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Resolution flow: 28×28 → 14×14 → 7×7 → 3×3 → 7×7 → 14×14 → 28×28</text>
    <text x="700" y="45" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Operations: MaxPool2d for downsampling, ConvTranspose2d for upsampling</text>
    <text x="700" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Final layer: 1×1 convolution for output channel reduction</text>
  </g>
</svg>