<svg viewBox="0 0 1600 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="bottleneckGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="timeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="attentionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1600" height="800" fill="#fff"/>
  
  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Diffusion Model: U-Net Architecture with Time Embeddings
  </text>
  
  <!-- Input -->
  <g transform="translate(50, 200)">
    <rect x="0" y="0" width="80" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Noisy</text>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Image</text>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
  </g>
  
  <!-- Time Input -->
  <g transform="translate(50, 320)">
    <rect x="0" y="0" width="80" height="50" fill="url(#timeGrad)" stroke="#8e44ad" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Time t</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">scalar</text>
  </g>
  
  <!-- Time MLP -->
  <g transform="translate(170, 320)">
    <rect x="0" y="0" width="100" height="50" fill="url(#timeGrad)" stroke="#8e44ad" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="50" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Time MLP</text>
    <text x="50" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">SinEmb + Linear</text>
  </g>
  
  <!-- Initial Conv -->
  <g transform="translate(170, 200)">
    <rect x="0" y="0" width="80" height="80" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="40" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">1→64</text>
    <text x="40" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Downsampling Path -->
  <text x="400" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2980b9">Downsampling</text>
  
  <!-- Down Block 1 -->
  <g transform="translate(300, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→128</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Embedding</text>
  </g>
  
  <!-- Self Attention 1 -->
  <g transform="translate(300, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128 ch</text>
  </g>
  
  <!-- Down Block 2 -->
  <g transform="translate(420, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→256</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Embedding</text>
  </g>
  
  <!-- Self Attention 2 -->
  <g transform="translate(420, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256 ch</text>
  </g>
  
  <!-- Down Block 3 -->
  <g transform="translate(540, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256→256</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">3×3</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">Embedding</text>
  </g>
  
  <!-- Self Attention 3 -->
  <g transform="translate(540, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256 ch</text>
  </g>
  
  <!-- Bottleneck -->
  <text x="750" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#e67e22">Bottleneck</text>
  
  <g transform="translate(680, 120)">
    <rect x="0" y="0" width="140" height="120" fill="url(#bottleneckGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Bottleneck</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Conv: 256→512</text>
    <text x="70" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Conv: 512→512</text>
    <text x="70" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Conv: 512→256</text>
    <text x="70" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">3×3 feature maps</text>
    <text x="70" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Deepest representation</text>
  </g>
  
  <!-- Upsampling Path -->
  <text x="1150" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#c0392b">Upsampling</text>
  
  <!-- Up Block 1 -->
  <g transform="translate(900, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">256→128</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ConvT2d</text>
  </g>
  
  <!-- Self Attention 4 -->
  <g transform="translate(900, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128 ch</text>
  </g>
  
  <!-- Up Block 2 -->
  <g transform="translate(1020, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→64</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ConvT2d</text>
  </g>
  
  <!-- Self Attention 5 -->
  <g transform="translate(1020, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64 ch</text>
  </g>
  
  <!-- Up Block 3 -->
  <g transform="translate(1140, 140)">
    <rect x="0" y="0" width="80" height="100" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Block</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→64</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">+ Time</text>
    <text x="40" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ConvT2d</text>
  </g>
  
  <!-- Self Attention 6 -->
  <g transform="translate(1140, 250)">
    <rect x="0" y="0" width="80" height="40" fill="url(#attentionGrad)" stroke="#27ae60" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Self-Attn</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64 ch</text>
  </g>
  
  <!-- Final Conv -->
  <g transform="translate(1280, 200)">
    <rect x="0" y="0" width="80" height="80" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Final</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→1</text>
    <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Output -->
  <g transform="translate(1420, 200)">
    <rect x="0" y="0" width="80" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Predicted</text>
    <text x="40" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">Noise</text>
    <text x="40" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#34495e">ε_θ(x_t, t)</text>
  </g>
  
  <!-- Arrows -->
  <!-- Input flow -->
  <path d="M 135 240 L 165 240" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 255 240 L 295 240" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Time embedding flow -->
  <path d="M 135 345 L 165 345" stroke="#8e44ad" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Time embedding to blocks (showing connections to first few blocks) -->
  <path d="M 270 320 Q 270 300 340 290" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 270 320 Q 380 300 460 290" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  <path d="M 270 320 Q 500 300 580 290" stroke="#8e44ad" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
  
  <!-- Downsampling flow -->
  <path d="M 385 190 L 415 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 505 190 L 535 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 625 190 L 675 190" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Attention connections -->
  <path d="M 340 245 L 340 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 460 245 L 460 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 580 245 L 580 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Bottleneck to upsampling -->
  <path d="M 825 180 L 895 190" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Upsampling flow -->
  <path d="M 985 190 L 1015 190" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1105 190 L 1135 190" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1225 190 L 1275 240" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Upsampling attention connections -->
  <path d="M 940 245 L 940 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1060 245 L 1060 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1180 245 L 1180 255" stroke="#27ae60" stroke-width="1.5" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Final output -->
  <path d="M 1365 240 L 1415 240" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Skip connections (U-Net) -->
  <path d="M 340 140 Q 340 80 640 80 Q 940 80 940 140" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 460 140 Q 460 90 650 90 Q 1060 90 1060 140" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <path d="M 580 140 Q 580 100 660 100 Q 1180 100 1180 140" stroke="#95a5a6" stroke-width="2" fill="none" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Skip connection labels -->
  <text x="640" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">Skip Connections</text>
  
  <!-- Training Process -->
  <g transform="translate(100, 450)">
    <rect x="0" y="0" width="1400" height="120" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="700" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Diffusion Training Process</text>
    
    <text x="50" y="50" font-family="Arial, sans-serif" font-size="12" fill="#34495e">1. Forward Process: x₀ → x₁ → x₂ → ... → xₜ (Add noise progressively)</text>
    <text x="50" y="70" font-family="Arial, sans-serif" font-size="12" fill="#34495e">2. Reverse Process: Model learns to predict noise ε at timestep t</text>
    <text x="50" y="90" font-family="Arial, sans-serif" font-size="12" fill="#34495e">3. Loss: L = ||ε - ε_θ(x_t, t)||² (MSE between true noise and predicted noise)</text>
    <text x="50" y="110" font-family="Arial, sans-serif" font-size="12" fill="#34495e">4. Time embeddings condition the model on the noise level</text>
  </g>
  
  <!-- Architecture Details -->
  <g transform="translate(100, 600)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Key Features:</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• U-Net architecture with skip connections for preserving fine details</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Time embeddings: Sinusoidal position embeddings + MLP conditioning</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Self-attention mechanisms at multiple resolutions for global context</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Progressive downsampling: 28×28 → 14×14 → 7×7 → 3×3, then upsampling</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• ResNet-style blocks with time embedding injection at each level</text>
  </g>
</svg>