<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="encoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="decoderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="latentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:0.8" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1400" height="600" fill="#ffffff"/>
  
  <!-- Title -->
  <text x="700" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Convolutional VAE: Architecture
  </text>
  
  <!-- Input Image -->
  <g transform="translate(50, 130)">
    <rect x="0" y="0" width="80" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Input</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">MNIST</text>
  </g>
  
  <!-- Encoder Section -->
  <text x="270" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980b9">Encoder</text>
  
  <!-- Conv Layer 1 -->
  <g transform="translate(160, 120)">
    <rect x="0" y="0" width="70" height="100" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">1→32</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
    <text x="35" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">BatchNorm</text>
    <text x="35" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">ReLU</text>
  </g>
  
  <!-- Conv Layer 2 -->
  <g transform="translate(250, 130)">
    <rect x="0" y="0" width="70" height="80" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→64</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">7×7</text>
  </g>
  
  <!-- Conv Layer 3 -->
  <g transform="translate(340, 140)">
    <rect x="0" y="0" width="70" height="60" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→128</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=3,s=1</text>
  </g>
  
  <!-- Flatten -->
  <g transform="translate(430, 150)">
    <rect x="0" y="0" width="60" height="40" fill="url(#encoderGrad)" stroke="#2980b9" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Flatten</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">6272</text>
  </g>
  
  <!-- Latent Parameters -->
  <g transform="translate(520, 130)">
    <rect x="0" y="0" width="60" height="40" fill="url(#latentGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">μ</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32-dim</text>
  </g>
  
  <g transform="translate(520, 180)">
    <rect x="0" y="0" width="60" height="40" fill="url(#latentGrad)" stroke="#f39c12" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">log σ²</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32-dim</text>
  </g>
  
  <!-- Reparameterization Trick -->
  <g transform="translate(620, 140)">
    <circle cx="30" cy="30" r="25" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">z = μ +</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">σ⊙ε</text>
    <text x="30" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white">ε~N(0,I)</text>
  </g>
  
  <!-- Latent Space -->
  <g transform="translate(700, 150)">
    <rect x="0" y="0" width="80" height="40" fill="url(#latentGrad)" stroke="#f39c12" stroke-width="3" rx="8" filter="url(#shadow)"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Latent z</text>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">32-dim</text>
  </g>
  
  <!-- Decoder Section -->
  <text x="920" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#c0392b">Decoder</text>
  
  <!-- Decoder Input -->
  <g transform="translate(800, 150)">
    <rect x="0" y="0" width="60" height="40" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Linear</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→6272</text>
  </g>
  
  <!-- Reshape -->
  <g transform="translate(880, 150)">
    <rect x="0" y="0" width="60" height="40" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="30" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Reshape</text>
    <text x="30" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128×7×7</text>
  </g>
  
  <!-- Decoder Conv Layer 1 -->
  <g transform="translate(960, 120)">
    <rect x="0" y="0" width="70" height="100" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">ConvT2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">128→64</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">14×14</text>
    <text x="35" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">BatchNorm</text>
    <text x="35" y="95" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">ReLU</text>
  </g>
  
  <!-- Decoder Conv Layer 2 -->
  <g transform="translate(1050, 130)">
    <rect x="0" y="0" width="70" height="80" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="white">ConvT2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">64→32</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">k=4,s=2</text>
    <text x="35" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">28×28</text>
  </g>
  
  <!-- Final Conv -->
  <g transform="translate(1140, 140)">
    <rect x="0" y="0" width="70" height="60" fill="url(#decoderGrad)" stroke="#c0392b" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="35" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">Conv2d</text>
    <text x="35" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">32→1</text>
    <text x="35" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="white">Sigmoid</text>
  </g>
  
  <!-- Output Image -->
  <g transform="translate(1230, 130)">
    <rect x="0" y="0" width="80" height="80" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="2" rx="5" filter="url(#shadow)"/>
    <text x="40" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">Output</text>
    <text x="40" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7f8c8d">28×28×1</text>
    <text x="40" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#34495e">Reconstructed</text>
  </g>
  
  <!-- Arrows -->
  <!-- Input to first conv -->
  <path d="M 135 170 L 155 170" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Between encoder convs -->
  <path d="M 235 170 L 245 170" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 325 170 L 335 170" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 415 170 L 425 170" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Flatten to latent params -->
  <path d="M 495 170 L 515 150" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 495 170 L 515 200" stroke="#2980b9" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Latent params to reparameterization -->
  <path d="M 585 150 L 615 155" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 585 200 L 615 185" stroke="#f39c12" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Reparameterization to latent -->
  <path d="M 665 170 L 695 170" stroke="#95a5a6" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Latent to decoder -->
  <path d="M 785 170 L 795 170" stroke="#f39c12" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Through decoder -->
  <path d="M 865 170 L 875 170" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 945 170 L 955 170" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1035 170 L 1045 170" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1125 170 L 1135 170" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- To output -->
  <path d="M 1215 170 L 1225 170" stroke="#34495e" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34495e"/>
    </marker>
  </defs>
  
  <!-- Loss Function -->
  <g transform="translate(525, 350)">
    <rect x="0" y="0" width="350" height="100" fill="#ffffff" stroke="#95a5a6" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="175" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">VAE Loss Function</text>
    <text x="175" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#34495e">L = BCE(x, x̂) + β·KLD(q(z|x) || p(z))</text>
    <text x="175" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">KLD = -½Σ(1 + log σ² - μ² - σ²)</text>
    <text x="175" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">Reconstruction Loss + Regularization</text>
  </g>
  
  <!-- Architecture Details -->
  <g transform="translate(50, 480)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Convolutional VAE Features:</text>
    <text x="0" y="25" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Convolutional encoder: Preserves spatial structure through feature maps</text>
    <text x="0" y="45" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Progressive downsampling: 28×28 → 14×14 → 7×7 → 6272-dim flattened</text>
    <text x="0" y="65" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Probabilistic latent space: 32-dimensional with μ and σ² parameters</text>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Transposed convolutions: Symmetric upsampling for reconstruction</text>
    <text x="0" y="105" font-family="Arial, sans-serif" font-size="12" fill="#34495e">• Reparameterization trick: Enables gradient flow through stochastic sampling</text>
  </g>
</svg>